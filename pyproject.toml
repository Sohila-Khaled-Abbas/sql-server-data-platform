[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sql-server-data-platform"
version = "2.0.0"
description = "Enterprise Microsoft SQL Server 2022 Data Platform & DBRE Engineering Suite"
readme = "README.md"
authors = [
    { name = "Sohila Khaled Abbas", email = "sohilakhaled811@gmail.com" }
]
requires-python = ">=3.9"
dependencies = [
    "pytest>=8.0.0",
    "sqlfluff>=3.0.0",
    "Faker>=24.0.0"
]

[project.optional-dependencies]
dev = [
    "ruff>=0.4.0",
    "pyodbc>=5.1.0"
]

[tool.pytest.ini_options]
testpaths = ["tests/python"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --strict-markers"

[tool.ruff]
line-length = 120
target-version = "py39"
